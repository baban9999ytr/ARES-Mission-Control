name: ARES release checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify app and Cloudflare Pages assets
        run: npm run check
      - name: Recompute and verify 30 measured mission scenarios
        run: node tools/generate_mission_results.mjs --check
      - name: Validate Cloudflare Workers assets deployment without publishing
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Install browser dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: npm run test:browser
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-elevation-profile-screenshots
          path: test-results/
          if-no-files-found: ignore
